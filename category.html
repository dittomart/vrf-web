<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu — VRF Kitchen</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="assets/theme.css" rel="stylesheet">
</head>
<body class="pb-28 md:pb-10">

<header class="appbar">
  <div class="appbar-inner">
    <div class="flex items-center gap-2.5">
      <a href="home.html" class="ibtn ibtn-ghost shrink-0"><i data-lucide="arrow-left" class="w-5 h-5"></i></a>
      <label class="appbar-search">
        <i data-lucide="search" class="w-4 h-4 text-[var(--green)] shrink-0"></i>
        <input id="search" placeholder="Search the menu…">
      </label>
      <a href="cart.html" class="ibtn relative shrink-0"><i data-lucide="shopping-bag" class="w-5 h-5"></i>
        <span data-cart-badge class="hidden ibtn-badge">0</span></a>
    </div>
  </div>
</header>

<!-- RICH HERO / INTRO STRIP -->
<div class="max-w-6xl mx-auto px-4 pt-4">
  <div class="cta-lux shine tex-dots rounded-3xl px-5 py-5 relative overflow-hidden">
    <div class="relative z-10 flex items-start justify-between gap-3">
      <div class="min-w-0">
        <p class="eyebrow text-[var(--gold)] mb-1.5">VRF Kitchen · Chef-crafted daily</p>
        <h1 class="script text-white text-[26px] leading-none mb-1.5">Full Menu</h1>
        <p id="hero-count" class="text-[13px] text-white/75"></p>
      </div>
      <span class="badge badge-green shrink-0 shadow-sm"><span class="veg-dot"></span> 100% Pure Veg</span>
    </div>
    <div class="relative z-10 mt-4 flex flex-wrap gap-2">
      <span class="ichip ichip-gold !w-auto px-3 gap-1.5 text-[11px] font-bold text-[var(--ink)]"><i data-lucide="leaf" class="w-3.5 h-3.5"></i> No onion · no garlic options</span>
      <span class="ichip ichip-gold !w-auto px-3 gap-1.5 text-[11px] font-bold text-[var(--ink)]"><i data-lucide="clock" class="w-3.5 h-3.5"></i> 30-min delivery</span>
    </div>
  </div>
</div>

<!-- CATEGORY RAIL (below the navbar) -->
<div class="max-w-6xl mx-auto px-4 pt-4 flex gap-2.5 overflow-x-auto no-scrollbar" id="chips"></div>

<div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-2 overflow-x-auto no-scrollbar">
  <button data-sort="pop" class="sortbtn shrink-0 flex items-center gap-1 text-xs font-bold btn-brand px-3.5 py-2 rounded-full press shadow-sm"><i data-lucide="flame" class="w-3.5 h-3.5"></i> Popular</button>
  <button data-sort="low" class="sortbtn shrink-0 text-xs font-bold bg-white border border-[var(--line)] shadow-sm px-3.5 py-2 rounded-full press">Price ↑</button>
  <button data-sort="high" class="sortbtn shrink-0 text-xs font-bold bg-white border border-[var(--line)] shadow-sm px-3.5 py-2 rounded-full press">Price ↓</button>
  <button data-filter="best" class="filterbtn shrink-0 flex items-center gap-1 text-xs font-bold bg-white border border-[var(--line)] shadow-sm px-3.5 py-2 rounded-full press"><i data-lucide="flame" class="w-3.5 h-3.5"></i> Bestsellers</button>
  <span class="shrink-0 ml-auto flex items-center gap-1 text-xs font-bold badge badge-green"><span class="veg-dot"></span> Pure Veg</span>
</div>

<div class="max-w-6xl mx-auto px-4 pb-3">
  <div class="cta-lux tex-dots rounded-2xl px-4 py-3 flex items-center gap-3 relative overflow-hidden">
    <span class="ichip ichip-gold shrink-0 relative z-10"><i data-lucide="ticket-percent" class="w-5 h-5"></i></span>
    <div class="relative z-10 min-w-0">
      <p class="text-sm font-bold text-white leading-tight">Flat 20% off your first order</p>
      <p class="text-[11px] text-white/70">Use code <b class="text-[var(--gold)]">VRF20</b> · Free delivery above ₹349</p>
    </div>
  </div>
</div>

<main class="max-w-6xl mx-auto px-4">
  <div class="sec-head reveal mb-5">
    <span class="ichip ichip-green shrink-0"><i data-lucide="utensils-crossed" class="w-5 h-5"></i></span>
    <div class="min-w-0">
      <p class="eyebrow eyebrow-g mb-0.5">Now serving</p>
      <h2 id="cat-title" class="sec-title leading-tight">Full Menu</h2>
      <p id="cat-count" class="text-sm text-[var(--ink-2)]"></p>
    </div>
  </div>
  <div id="list" class="grid-products"></div>
  <div id="empty" class="hidden empty-wrap"><div class="empty-emoji"><i data-lucide="utensils-crossed" class="w-9 h-9 text-[var(--brand)]"></i></div><p class="empty-title">No dishes found</p><p class="empty-sub">Try a different search or category.</p></div>
</main>

<div id="sticky-cart" class="fixed bottom-28 md:bottom-4 inset-x-0 z-30 px-4 transition-transform duration-300 translate-y-40">
  <a href="cart.html" class="max-w-6xl mx-auto flex items-center justify-between cta-lux rounded-2xl px-5 py-3.5 shadow-2xl press">
    <span class="flex items-center gap-2 text-sm font-semibold"><i data-lucide="shopping-bag" class="w-5 h-5"></i><span data-sc-count>0 items</span></span>
    <span class="flex items-center gap-2 font-bold"><span data-sc-total>₹0</span><i data-lucide="arrow-right" class="w-5 h-5"></i></span>
  </a>
</div>

<script src="assets/app.js"></script>
<script>
  requireLocation();
  const params=new URLSearchParams(location.search);
  let activeCat=params.get("cat")||"all";
  let sort="pop", onlyBest=false, query="";
  const chips=document.getElementById("chips");
  function renderChips(){
    const all=[{id:"all",name:"All",icon:"grid-2x2"},...CATEGORIES];
    chips.innerHTML=all.map(c=>{
      const on=activeCat===c.id;
      return `<button data-cat="${c.id}" class="cat-chip shrink-0 ${on?'is-active':''}">
        <span class="cat-chip-ico"><i data-lucide="${c.icon}"></i></span>
        <span>${c.name}</span>
      </button>`;}).join("");
    chips.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{activeCat=b.dataset.cat;renderChips();render();});
    lucide.createIcons();
  }
  function vegDot(){return `<span class="veg-dot"></span>`;}
  function card(p){
    const off=Math.round((1-p.price/p.mrp)*100);
    return `<div class="ui-card card-topline overflow-hidden flex flex-col lift">
      <a href="product.html?id=${p.id}" class="relative frame block">
        <img src="${prodImg(p,300,220)}" class="w-full h-32 object-cover" alt="${p.name}">
        <span class="absolute top-2.5 left-2.5 rounded-md p-0.5 bg-white shadow-sm">${vegDot()}</span>
        ${off>0?`<span class="absolute top-2.5 right-2.5 badge badge-accent shadow-sm">${off}% OFF</span>`:''}
        ${p.best?`<span class="absolute bottom-0 left-0 bg-gradient-to-r from-[var(--brand)] to-transparent text-white text-[10px] font-bold px-2.5 py-1 tracking-wide flex items-center gap-1"><i data-lucide="flame" class="w-3 h-3 fill-current"></i> BESTSELLER · ${p.ordered}×</span>`:''}
      </a>
      <div class="p-3 flex flex-col flex-1">
        <div class="flex items-center gap-2">
          <a href="product.html?id=${p.id}" class="font-bold text-sm leading-tight line-clamp-1 flex-1">${p.name}</a>
          <span class="shrink-0 flex items-center gap-0.5 text-[10px] font-bold badge badge-gold !py-0.5 !px-1.5"><i data-lucide="star" class="w-2.5 h-2.5 fill-current"></i>4.8</span>
        </div>
        <p class="text-[11px] text-[var(--ink-2)] line-clamp-2 mt-1 flex-1 leading-relaxed">${p.desc}</p>
        <div class="flex items-end justify-between mt-2.5">
          <div class="tnum leading-none">
            <span class="script text-[18px] text-[var(--green)]">${money(p.price)}</span>
            <span class="text-[11px] text-[var(--ink-2)] line-through ml-1">${money(p.mrp)}</span>
          </div>
          ${off>0?`<span class="badge badge-green !py-0.5 !px-1.5 text-[10px] font-bold">Save ${off}%</span>`:''}
        </div>
        <div data-add="${p.id}" class="mt-2.5"></div>
      </div></div>`;
  }
  function stepper(id){
    const c=getCart(); const q=c[id]||0;
    if(q===0) return `<button onclick="addToCart('${id}');toast('Added');flyToCart(this);render()" class="w-full border border-[var(--brand)] text-[var(--brand)] font-bold text-xs py-2.5 rounded-xl press active:bg-[var(--brand)] active:text-white transition-colors tracking-wide">ADD +</button>`;
    return `<div class="flex items-center justify-between btn-brand rounded-xl font-bold text-sm px-1 anim-scalein">
      <button onclick="setQty('${id}',${q-1});render()" class="px-3 py-1.5 press">−</button><span>${q}</span>
      <button onclick="setQty('${id}',${q+1});render()" class="px-3 py-1.5 press">+</button></div>`;
  }
  function render(){
    let items=PRODUCTS.slice();
    if(activeCat!=="all") items=items.filter(p=>p.cat===activeCat);
    if(onlyBest) items=items.filter(p=>p.best);
    if(query) items=items.filter(p=>p.name.toLowerCase().includes(query)||p.desc.toLowerCase().includes(query));
    if(sort==="low") items.sort((a,b)=>a.price-b.price);
    else if(sort==="high") items.sort((a,b)=>b.price-a.price);
    else items.sort((a,b)=>b.ordered-a.ordered);
    const cat=CATEGORIES.find(c=>c.id===activeCat);
    document.getElementById("cat-title").textContent = cat?cat.name : "Full Menu";
    document.getElementById("cat-count").textContent = `${items.length} pure-veg dishes`;
    const hc=document.getElementById("hero-count"); if(hc) hc.textContent = `${items.length} dishes · handpicked & freshly made`;
    const list=document.getElementById("list");
    list.className="grid-products stagger";
    list.innerHTML=items.map(card).join("");
    document.getElementById("empty").classList.toggle("hidden", items.length>0);
    items.forEach(p=>{ const slot=list.querySelector(`[data-add="${p.id}"]`); if(slot) slot.innerHTML=stepper(p.id); });
    lucide.createIcons(); updateCartBadges();
  }
  document.getElementById("search").addEventListener("input",e=>{query=e.target.value.trim().toLowerCase();render();});
  document.querySelectorAll(".sortbtn").forEach(b=>b.onclick=()=>{
    sort=b.dataset.sort;
    document.querySelectorAll(".sortbtn").forEach(x=>x.className="sortbtn shrink-0 text-xs font-semibold bg-white shadow-sm px-3 py-2 rounded-full press");
    b.className="sortbtn shrink-0 flex items-center gap-1 text-xs font-semibold btn-brand px-3 py-2 rounded-full press";
    render();
  });
  document.querySelector(".filterbtn").onclick=function(){
    onlyBest=!onlyBest;
    this.className="filterbtn shrink-0 flex items-center gap-1 text-xs font-semibold px-3 py-2 rounded-full press "+(onlyBest?"btn-brand":"bg-white shadow-sm");
    render();
  };
  renderChips(); render(); injectChrome("search");
</script>
</body>
</html>
