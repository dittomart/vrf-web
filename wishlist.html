<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wishlist — VRF Kitchen</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="assets/theme.css" rel="stylesheet">
</head>
<body class="bg-[var(--cream)] text-[var(--ink)] pb-28 md:pb-10">
<header class="appbar">
  <div class="appbar-inner narrow flex items-center gap-3">
    <a href="profile.html" class="ibtn ibtn-ghost shrink-0"><i data-lucide="arrow-left" class="w-5 h-5"></i></a>
    <h1 class="appbar-title">Wishlist</h1>
  </div>
</header>
<main class="max-w-6xl mx-auto px-4 pt-6">
  <div class="reveal mb-4 sec-head">
    <span class="ichip ichip-brand"><i data-lucide="heart" class="w-5 h-5"></i></span>
    <div class="min-w-0"><p class="eyebrow">Saved for later</p><h2 class="sec-title leading-tight">Your favourites</h2></div>
  </div>
  <div id="wl-summary" class="reveal mb-5 flex items-center gap-2 flex-wrap"></div>
  <div id="list" class="grid-products stagger"></div>
  <div id="empty" class="hidden empty-wrap">
    <div class="empty-emoji"><i data-lucide="heart" class="w-9 h-9 text-[var(--green)]"></i></div>
    <p class="empty-title">No favourites yet</p>
    <p class="empty-sub">Tap the heart on any dish to save it here for quick ordering.</p>
    <a href="category.html" class="pill pill-green mt-5">Explore the menu <i data-lucide="arrow-right" class="w-4 h-4"></i></a>
  </div>
</main>
<script src="assets/app.js"></script>
<script>
  requireLocation();
  function render(){
    // dynamic: real saved wishlist (seed a few favourites on first visit)
    if(!localStorage.getItem("vrf_wishlist")) localStorage.setItem("vrf_wishlist",JSON.stringify(["p6","p23","p13","p20"]));
    const wl=getWishlist().map(getProduct).filter(Boolean);
    document.getElementById("empty").classList.toggle("hidden", wl.length>0);
    const sum=document.getElementById("wl-summary");
    if(sum){ sum.classList.toggle("hidden", wl.length===0);
      sum.innerHTML = wl.length? `<span class="badge badge-accent shadow-sm"><i data-lucide="bookmark" class="w-3.5 h-3.5"></i> ${wl.length} saved</span>
        <span class="badge badge-green"><span class="veg-dot"></span> Pure Veg</span>
        <span class="badge badge-gold"><i data-lucide="zap" class="w-3.5 h-3.5"></i> Ready to reorder</span>` : "";
    }
    document.getElementById("list").innerHTML=wl.map(p=>{
      const off=Math.round((1-p.price/p.mrp)*100);
      return `
    <div class="ui-card card-topline overflow-hidden lift flex flex-col">
      <a href="product.html?id=${p.id}" class="relative block frame">
        <img src="${prodImg(p,300,220)}" class="w-full h-32 object-cover" alt="${p.name}">
        <span class="absolute top-2.5 left-2.5 bg-white/95 rounded-md p-0.5 shadow-sm"><span class="veg-dot"></span></span>
        <button onclick="event.preventDefault();toggleWishlist('${p.id}');toast('Removed from wishlist','heart');render()" class="absolute top-2.5 right-2.5 w-8 h-8 rounded-full bg-white/95 flex items-center justify-center shadow-sm press"><i data-lucide="heart" class="w-4 h-4 fill-[var(--brand)] text-[var(--brand)]"></i></button>
        ${off>0?`<span class="absolute bottom-2.5 left-2.5 badge badge-accent shadow-sm">${off}% OFF</span>`:''}
      </a>
      <div class="p-3.5 flex flex-col flex-1">
        <div class="flex items-center gap-2">
          <a href="product.html?id=${p.id}" class="font-bold text-sm line-clamp-1 flex-1">${p.name}</a>
          <span class="shrink-0 flex items-center gap-0.5 text-[10px] font-bold badge badge-gold !py-0.5 !px-1.5"><i data-lucide="star" class="w-2.5 h-2.5 fill-current"></i>4.8</span>
        </div>
        <p class="text-[11px] text-[var(--ink-2)] line-clamp-1 mt-1 flex-1">${p.desc}</p>
        <div class="flex items-end justify-between mt-2.5">
          <div class="tnum leading-none">
            <span class="script text-[18px] text-[var(--green)]">${money(p.price)}</span>
            <span class="text-[11px] text-[var(--ink-2)] line-through ml-1">${money(p.mrp)}</span>
          </div>
          <button onclick="addToCart('${p.id}');toast('Added ${p.name}');flyToCart(this)" class="text-xs btn-outline press font-bold px-3.5 py-1.5 rounded-xl">ADD +</button>
        </div>
      </div>
    </div>`;}).join("");
    lucide.createIcons(); updateCartBadges();
  }
  render(); injectChrome("profile");
</script>
</body>
</html>
