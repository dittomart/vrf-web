<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Order — VRF Kitchen</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="assets/theme.css" rel="stylesheet">
</head>
<body class="bg-[var(--cream)] text-[var(--ink)] pb-28">

<header class="appbar">
  <div class="appbar-inner narrow flex items-center gap-3">
    <a href="home.html" class="ibtn ibtn-ghost shrink-0"><i data-lucide="arrow-left" class="w-5 h-5"></i></a>
    <h1 class="appbar-title">Track Order</h1>
    <span class="ml-auto text-sm font-semibold text-[var(--green)]" id="oid"></span>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 pt-6">
  <!-- map mock -->
  <div class="relative rounded-[22px] overflow-hidden h-56 ui-card-lux card-topline reveal" style="background:#dfeee2">
    <svg viewBox="0 0 400 200" class="w-full h-full" preserveAspectRatio="xMidYMid slice">
      <rect width="400" height="200" fill="#e4efe6"/>
      <path d="M0 60 H400 M0 130 H400 M120 0 V200 M280 0 V200" stroke="#cadfce" stroke-width="6" fill="none"/>
      <rect x="150" y="72" width="40" height="34" rx="4" fill="#d3e6d7"/>
      <rect x="300" y="140" width="46" height="40" rx="4" fill="#d3e6d7"/>
      <path id="route" d="M60 150 C 140 150, 160 70, 280 60" stroke="var(--brand)" stroke-width="4" fill="none" stroke-dasharray="6 6"/>
      <circle cx="60" cy="150" r="11" fill="var(--green)" opacity=".18"/>
      <circle cx="60" cy="150" r="8" fill="var(--green)"/>
      <circle cx="280" cy="60" r="11" fill="var(--brand)" opacity=".18"/>
      <circle cx="280" cy="60" r="8" fill="var(--brand)"/>
      <g id="rider"><circle cx="150" cy="118" r="14" fill="white" stroke="var(--brand)" stroke-width="2"/><circle cx="150" cy="118" r="5" fill="var(--brand)"/></g>
    </svg>
    <div class="absolute top-3 left-3 glass rounded-full px-3.5 py-1.5 text-xs font-bold shadow flex items-center gap-1.5 border border-[var(--line)]"><i data-lucide="timer" class="w-4 h-4 text-[var(--brand)]"></i> <span id="eta">35</span> min away</div>
    <div class="absolute bottom-3 left-3 right-3 flex items-center justify-between gap-2">
      <span class="badge badge-green bg-white/90"><i data-lucide="utensils-crossed" class="w-3 h-3"></i> VRF Kitchen</span>
      <span class="badge badge-accent bg-white/90"><i data-lucide="map-pin" class="w-3 h-3"></i> Your door</span>
    </div>
  </div>

  <div class="lg-2col mt-4">
  <div>
  <!-- status banner -->
  <div class="relative ui-card ui-card-lux card-topline ui-card-pad mt-4 overflow-hidden reveal" data-d="1">
    <div class="tex-dots absolute inset-0 opacity-60 pointer-events-none"></div>
    <div class="relative flex items-center gap-3.5">
      <div class="w-14 h-14 rounded-2xl flex items-center justify-center bob shrink-0" id="status-emoji" style="background:linear-gradient(135deg,var(--brand-soft),var(--gold-soft))"><i data-lucide="chef-hat" class="w-7 h-7 text-[var(--brand)]"></i></div>
      <div class="flex-1 min-w-0"><p class="eyebrow eyebrow-g mb-0.5">Live status</p><p class="display font-bold text-lg leading-tight" id="status-title">Preparing your food</p><p class="text-xs text-[var(--ink-2)] mt-0.5" id="status-sub">Our chef is cooking it fresh</p></div>
    </div>
  </div>

  <!-- timeline -->
  <div class="ui-card ui-card-lux ui-card-pad mt-4 reveal" data-d="2">
    <div class="sec-head mb-4">
      <span class="ichip ichip-green w-8 h-8 rounded-lg"><i data-lucide="route" class="w-4 h-4"></i></span>
      <p class="eyebrow-g eyebrow">Order journey</p>
    </div>
    <div id="timeline" class="space-y-0"></div>
  </div>
  </div>

  <div class="lg-aside">
  <!-- delivery partner -->
  <div id="partner-card" class="hidden ui-card ui-card-lux card-topline ui-card-pad mt-4 flex items-center gap-3 reveal">
    <div class="frame rounded-full shrink-0"><img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&h=100&fit=crop" class="w-12 h-12 rounded-full object-cover" alt="rider"></div>
    <div class="flex-1 min-w-0"><p class="eyebrow eyebrow-g mb-0.5">Delivery partner</p><p class="font-bold text-sm">Suresh K.</p><p class="text-xs text-[var(--ink-2)]">On the way · <span class="text-[var(--brand)] font-semibold">★ 4.9</span></p></div>
    <a href="tel:9372381280" class="ichip ichip-green w-11 h-11 press"><i data-lucide="phone" class="w-5 h-5"></i></a>
    <a href="https://wa.me/919372381280" class="ichip ichip-green w-11 h-11 press"><i data-lucide="message-circle" class="w-5 h-5"></i></a>
  </div>

  <!-- reorder CTA (shown when delivered) -->
  <div id="reorder-cta" class="hidden relative cta-lux tex-dots text-white rounded-[22px] p-5 mt-4 flex items-center gap-3.5 shadow-lg overflow-hidden">
    <div class="absolute -top-8 -right-6 w-28 h-28 rounded-full blur-2xl pointer-events-none" style="background:radial-gradient(circle,rgba(233,200,119,.4),transparent 70%)"></div>
    <div class="relative w-12 h-12 rounded-2xl bg-white/15 flex items-center justify-center shrink-0"><i data-lucide="rotate-ccw" class="w-6 h-6"></i></div>
    <div class="relative flex-1 min-w-0"><p class="script text-base leading-none" style="color:var(--gold)">Enjoyed your meal?</p><p class="font-bold text-sm mt-1">Reorder the same in one tap</p></div>
    <button id="reorder-btn" class="relative bg-white text-[var(--green)] text-xs font-bold px-4 py-2.5 rounded-xl press shine">Reorder</button>
  </div>

  <button onclick="jump()" class="w-full mt-5 text-xs text-[var(--ink-2)] underline">Demo: skip to next status</button>
  </div>
  </div>
</main>

<script src="assets/app.js"></script>
<script>
  requireLocation();
  let o={}; try{o=JSON.parse(localStorage.getItem("vrf_last_order"))||{}}catch(e){}
  document.getElementById("oid").textContent="#"+(o.id||"VRF000000");

  const steps=[
    {t:"Order Placed",s:"We've received your order",e:"receipt-text"},
    {t:"Order Accepted",s:"Kitchen confirmed your order",e:"check-check"},
    {t:"Preparing food",s:"Our chef is cooking it fresh",e:"chef-hat"},
    {t:"Out for delivery",s:"Suresh is on the way with your food",e:"bike"},
    {t:"Delivered",s:"Enjoy your meal!",e:"package-check"},
  ];
  let cur=2; // start at preparing
  function render(){
    const tl=document.getElementById("timeline");
    tl.innerHTML=steps.map((st,i)=>{
      const done=i<cur, active=i===cur;
      return `<div class="flex gap-3">
        <div class="flex flex-col items-center">
          <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold ${done||active?'bg-[var(--brand)] text-white':'text-[var(--ink-2)]'}" ${done||active?'':'style="background:var(--ivory-2)"'}>${done?'✓':i+1}</div>
          ${i<steps.length-1?`<div class="w-0.5 flex-1 min-h-[28px]" style="background:${done?'var(--brand)':'var(--line)'}"></div>`:''}
        </div>
        <div class="pb-4 ${active?'':'opacity-'+(done?'100':'50')}">
          <p class="font-semibold text-sm ${active?'text-[var(--brand)]':''}">${st.t}</p>
          <p class="text-xs text-[var(--ink-2)]">${st.s}</p>
        </div></div>`;
    }).join("");
    document.getElementById("status-emoji").innerHTML=`<i data-lucide="${steps[cur].e}" class="w-7 h-7 text-[var(--brand)]"></i>`;
    document.getElementById("status-title").textContent=steps[cur].t;
    document.getElementById("status-sub").textContent=steps[cur].s;
    document.getElementById("eta").textContent=Math.max(2,35-cur*8);
    document.getElementById("partner-card").classList.toggle("hidden",cur<3);
    document.getElementById("reorder-cta").classList.toggle("hidden",cur<4);
    // move rider
    const rider=document.getElementById("rider");
    if(rider) rider.style.transform=`translate(${cur*22}px,${-cur*12}px)`, rider.style.transition="transform 1s";
    lucide.createIcons();
  }
  window.jump=()=>{ if(cur<steps.length-1){cur++;render();} };
  document.getElementById("reorder-btn").onclick=()=>{
    (o.items||[]).forEach(i=>addToCart(i.id,i.qty));
    toast("Items added to cart","rotate-ccw");
    setTimeout(()=>location.href="cart.html",600);
  };
  render();
  // auto-advance
  const auto=setInterval(()=>{if(cur<steps.length-1){cur++;render();}else clearInterval(auto);},4000);
</script>
</body>
</html>
