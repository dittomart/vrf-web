<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VRF Kitchen — Pure Veg</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="assets/themes.js"></script>
<link href="assets/theme.css" rel="stylesheet">
<style>
  /* ---- entirely new: light premium splash ---- */
  .splash{position:fixed;inset:0;overflow:hidden;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:2rem;background:var(--ivory)}
  /* soft brand light pools */
  .splash::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(46% 40% at 16% 6%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 60%),
      radial-gradient(48% 44% at 86% 94%, color-mix(in srgb, var(--primary) 15%, transparent), transparent 62%),
      radial-gradient(64% 54% at 50% 48%, color-mix(in srgb, var(--gold) 12%, transparent), transparent 72%)}
  /* faint dotted texture */
  .splash::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
    background-image:radial-gradient(color-mix(in srgb, var(--primary) 6%, transparent) 1.2px,transparent 1.2px);background-size:26px 26px}

  /* logo mark + orbiting arc */
  .mark{position:relative;width:158px;height:158px;display:flex;align-items:center;justify-content:center}
  .mark .arc{position:absolute;inset:0;animation:arcspin 1.5s linear infinite}
  .mark .arc circle{fill:none;stroke:var(--gold);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:80 300}
  .mark .arc .track{stroke:var(--line);stroke-width:2.5;stroke-dasharray:none;opacity:.9}
  @keyframes arcspin{to{transform:rotate(360deg)}}
  .mark .tile{width:116px;height:116px;border-radius:30px;overflow:hidden;background:var(--brand);
    display:flex;align-items:center;justify-content:center;position:relative;
    box-shadow:0 26px 54px -20px color-mix(in srgb, var(--accent) 55%, transparent),0 0 0 6px #fff,0 0 0 7px var(--line);
    animation:markIn 1s cubic-bezier(.2,.8,.25,1.15) both}
  .mark .tile img{width:135%;max-width:none;height:100%;object-fit:cover}
  @keyframes markIn{0%{opacity:0;transform:scale(.62) translateY(18px)}60%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}

  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .rise{animation:rise .8s cubic-bezier(.2,.7,.3,1) both}

  .gold-rule{height:1px;width:64px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}

  /* colourful bouncing dot loader */
  .dot3{display:flex;gap:.45rem}
  .dot3 span{width:9px;height:9px;border-radius:9999px;animation:dotb 1s ease-in-out infinite}
  .dot3 span:nth-child(1){background:var(--green)}
  .dot3 span:nth-child(2){background:var(--brand);animation-delay:.16s}
  .dot3 span:nth-child(3){background:var(--gold);animation-delay:.32s}
  @keyframes dotb{0%,100%{transform:translateY(0);opacity:.35}50%{transform:translateY(-7px);opacity:1}}
</style>
</head>
<body class="text-[var(--ink)]">
<div class="splash">

  <div class="relative z-10 flex flex-col items-center">

    <!-- logo mark with orbiting arc -->
    <div class="mark">
      <svg class="arc" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="track" cx="50" cy="50" r="47"></circle>
        <circle cx="50" cy="50" r="47"></circle>
      </svg>
      <div class="tile"><img src="assets/image.png" alt="VRF Kitchen"></div>
    </div>

    <p class="text-[11px] font-bold tracking-[.3em] uppercase mt-9 rise" style="animation-delay:.35s;color:var(--brand)">Vijay Raghavan's</p>
    <h1 class="display text-[44px] font-semibold leading-none mt-2 rise text-[var(--ink)]" style="animation-delay:.45s">VRF Kitchen</h1>
    <p class="script text-2xl mt-2 rise" style="animation-delay:.58s;color:var(--gold)">Pure Veg, perfected</p>

    <div class="gold-rule mt-6 rise" style="animation-delay:.7s"></div>

    <!-- feature chips -->
    <div class="flex items-center gap-2.5 mt-6 rise" style="animation-delay:.82s">
      <span class="flex items-center gap-1.5 text-[11px] font-bold bg-white border border-[var(--line)] px-3 py-1.5 rounded-full" style="box-shadow:var(--shadow-sm)"><i data-lucide="leaf" class="w-3.5 h-3.5 text-[var(--green)]"></i> 100% Veg</span>
      <span class="flex items-center gap-1.5 text-[11px] font-bold bg-white border border-[var(--line)] px-3 py-1.5 rounded-full" style="box-shadow:var(--shadow-sm)"><i data-lucide="timer" class="w-3.5 h-3.5 text-[var(--green)]"></i> 35-min</span>
      <span class="flex items-center gap-1.5 text-[11px] font-bold bg-white border border-[var(--line)] px-3 py-1.5 rounded-full" style="box-shadow:var(--shadow-sm)"><i data-lucide="star" class="w-3.5 h-3.5 text-[var(--gold)] fill-[var(--gold)]"></i> 4.8</span>
    </div>
  </div>

  <!-- loader -->
  <div class="absolute bottom-16 flex flex-col items-center gap-3.5 rise" style="animation-delay:.95s">
    <div class="dot3"><span></span><span></span><span></span></div>
    <p class="text-[11px] text-[var(--ink-2)] font-bold tracking-[.22em] uppercase">Preparing your table…</p>
  </div>

  <p class="absolute bottom-6 text-[10px] text-[var(--ink-2)] font-bold tracking-[.28em] uppercase" style="opacity:.6">Taste · Time · Quality</p>
</div>

<script src="assets/app.js"></script>
<script>
  setTimeout(()=>{
    let loc=null; try{loc=JSON.parse(localStorage.getItem("dittomart_location"))}catch(e){}
    if(loc && loc.serviceable && loc.lat!=null) window.location.replace("home.html");
    else window.location.replace("location.html");
  }, 2600);
  lucide.createIcons();
</script>
</body>
</html>
